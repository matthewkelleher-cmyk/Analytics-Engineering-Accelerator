# name project 
name: 'eia_energy'
version: '1.0.0'

#profile name 
profile: 'eia_energy'

# add folders as they are manually created 
model-paths: ["models"]

# configure models 
models: 
  eia_energy:
    staging:
      +materialized: view 
      +schema: stg
    intermediate: 
      +materialized: view 
      +schema: int
      dimensions:
        +materialized: table 
      facts:
        +materialized: table 
    marts:
      +materialized: table 
      +schema: mart
      
seeds: 
  eia_energy:
    +schema: stg