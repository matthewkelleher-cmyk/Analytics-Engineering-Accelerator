# name project 
name: 'eia_energy'
version: '1.0.0'

#profile name 
profile: 'eia_energy'

# add folders as they are manually created 
model-paths: ["models"]

# configure models 
models: 
  eia_energy:
    staging:
      +materialized: view 
    intermediate: 
      +materialized: view 
      dimensions:
        +materialized: table 
      facts:
        +materialized: table 
    marts:
      +materialized: table 
seeds: 
  eia_energy:
    country_coordinates:
      +column_types:
        origin_id: varchar
        origin_name: varchar
        iso2: varchar
        iso3: varchar
        continent: varchar
        is_known: boolean
        longitude: float
        latitude: float
    port_coordinates:
      +column_types:
        destination_id: varchar
        port_name: varchar 
        state: varchar 
        latitude: float
        longitude: float 
        coordinate_basis: varchar
        
