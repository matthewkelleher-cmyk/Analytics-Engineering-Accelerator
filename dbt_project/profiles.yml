eia_energy:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: ENERGY_PIPELINE_ROLE
      warehouse: ENERGY_WH
      database: TIL_DATA_ENGINEERING
      schema: DBT_MK
      threads: 1
    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: ENERGY_PIPELINE_ROLE
      warehouse: ENERGY_WH
      database: TIL_DATA_ENGINEERING
      schema: DBT_MK
      threads: 1