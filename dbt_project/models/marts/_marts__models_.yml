version: 2

models:
  - name: mart_spot_prices_daily
    description: >
      Daily WTI and Brent spot prices with the Brent-WTI spread, one row per
      day that has at least one price. Weekends and market holidays have no
      rows. The spread is null on days with only one price, and prices can
      be negative (WTI on 2020-04-20). Built for BI tools without relying on
      relationships between tables.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "brent_wti_spread is null or (wti_price is not null and brent_price is not null)"
    columns:
      - name: date_day
        description: Trading date. Key of this table.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('_int_dim_date')
                field: date_day
      - name: month_start_date
        description: First day of the month the date falls in.
        data_tests:
          - not_null
      - name: date_year
        description: Calendar year number.
      - name: date_quarter
        description: Calendar quarter number, 1 to 4.
      - name: month_num
        description: Month number, 1 to 12.
      - name: month_name
        description: Abbreviated month name.
      - name: wti_price
        description: WTI spot price for the day. Null on days with no WTI price. Can be negative.
      - name: brent_price
        description: Brent spot price for the day. Null on days with no Brent price.
      - name: brent_wti_spread
        description: Brent price minus WTI price. Null when either price is missing.